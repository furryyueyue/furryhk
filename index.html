  <script>
    (() => {
      const root = document.getElementById('yueyue-preview');
      const panel = root.querySelector('#yy-contact-detail');
      const detail = panel.querySelector('.yy-detail');
      const buttons = [...root.querySelectorAll('[data-contact]')];
      const templates = {'微信':'#yy-wechat-template','QQ':'#yy-qq-template','抖音':'#yy-douyin-template','邮箱':'#yy-email-template'};
      let selected = null;
      let contactGeneration = 0;
      let contactSwitching = false;
      let contactCollapseAnimation = null;
      const motionCounts = new WeakMap();
      const canAnimate = typeof Element.prototype.animate === 'function' && typeof Element.prototype.getAnimations === 'function';
      const animateMotion = (element, frames, options) => {
        if (!canAnimate) {
          const finalFrame = frames[frames.length - 1] || {};
          Object.entries(finalFrame).forEach(([property,value]) => {
            if (property !== 'offset' && property !== 'easing' && property !== 'composite') element.style[property] = value;
          });
          return {finished:Promise.resolve(),cancel(){}};
        }
        const compositorMotion = frames.some(frame => 'transform' in frame || 'opacity' in frame) && !frames.some(frame => 'height' in frame || 'width' in frame);
        if (compositorMotion) {
          motionCounts.set(element,(motionCounts.get(element) || 0) + 1);
          element.style.willChange = 'transform, opacity';
        }
        const animation = element.animate(frames,options);
        if (compositorMotion) {
          const release = () => {
            const remaining = Math.max(0,(motionCounts.get(element) || 1) - 1);
            motionCounts.set(element,remaining);
            if (!remaining) element.style.willChange = '';
          };
          animation.finished.then(release,release);
        }
        return animation;
      };
      const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)');
      const sparkle = root.querySelector('img[data-emoji="emoji_u2728.svg"]');
      root.querySelectorAll('template').forEach(template => {
        template.content.querySelectorAll('.yy-qr').forEach(image => {
          const trigger = document.createElement('button');
          trigger.type = 'button';
          trigger.className = 'yy-qr-trigger cursor-interaction';
          trigger.setAttribute('aria-label', '点击放大' + image.alt);
          trigger.setAttribute('aria-haspopup', 'dialog');
          image.before(trigger);
          trigger.append(image);
          const tip = document.createElement('span');
          tip.className = 'yy-zoom-tip';
          tip.textContent = '点击放大';
          const face = sparkle.cloneNode(true);
          face.setAttribute('aria-hidden','true');
          tip.append(face);
          trigger.append(tip);
        });
      });
      const rewardButton = root.querySelector('#yy-reward');
      const rewardEmoji = rewardButton.querySelector('img');
      const rewardLabel = document.createElement('span');
      rewardLabel.className = 'yy-reward-label';
      const rewardTitle = document.createElement('span');
      rewardTitle.textContent = '请我喝杯奶茶';
      const rewardHint = document.createElement('span');
      rewardHint.className = 'yy-reward-hint';
      rewardHint.textContent = '点击有惊喜';
      const rewardSparkle = sparkle.cloneNode(true);
      rewardSparkle.style.width = '13px';
      rewardSparkle.style.height = '13px';
      rewardHint.append(' ', rewardSparkle);
      rewardLabel.append(rewardTitle,rewardHint);
      const supportArrow = document.createElement('span');
      supportArrow.className = 'yy-support-arrow';
      supportArrow.textContent = '↗';
      rewardButton.replaceChildren(rewardEmoji,rewardLabel,supportArrow);
      const dialog = root.querySelector('#yy-qr-dialog');
      const stage = root.querySelector('#yy-dialog-stage');
      const dialogTitle = root.querySelector('#yy-dialog-title');
      const dialogCaption = root.querySelector('.yy-dialog-caption');
      const page = root.querySelector('.yy-page');
      const shade = root.querySelector('#yy-shade');
      let originImage = null;
      let imageSlot = null;
      let imageFlight = null;
      let inertStates = [];
      let previousMinHeight = '';
      let closingDialog = false;
      let openingDialog = false;
      let lastHaptic = 0;
      const feedbackTimers = new WeakMap();
      const tapHaptic = () => {
        const now = performance.now();
        if (now - lastHaptic < 80) return;
        lastHaptic = now;
        if (typeof navigator.vibrate === 'function') {
          try { navigator.vibrate(8); } catch (_) {}
        }
      };
      const finishClose = () => {
        if (imageFlight) { imageFlight.cancel();imageFlight = null; }
        if (originImage && imageSlot) {
          originImage.classList.remove('yy-dialog-image');
          imageSlot.replaceWith(originImage);
          imageSlot = null;
        }
        dialog.hidden = true;
        dialog.setAttribute('aria-hidden','true');
        dialog.classList.remove('yy-present');
        shade.hidden = true;
        shade.classList.remove('is-open');
        page.style.minHeight = previousMinHeight;
        inertStates.forEach(([element,inert]) => { element.inert = inert; });
        inertStates = [];
        const trigger = originImage && originImage.closest('.yy-qr-trigger');
        if (trigger && trigger.isConnected) trigger.focus({preventScroll:true});
        originImage = null;
        closingDialog = false;
        openingDialog = false;
      };
      const closeImage = () => {
        if (dialog.hidden || closingDialog) return;
        closingDialog = true;
        shade.classList.remove('is-open');
        dialog.classList.remove('yy-present');
        if (reduceMotion.matches) { finishClose(); return; }
        const start = getComputedStyle(originImage).transform;
        if (imageFlight) { imageFlight.cancel();imageFlight = null; }
        const expanded = originImage.getBoundingClientRect();
        const target = imageSlot.getBoundingClientRect();
        const dx = target.left - expanded.left;
        const dy = target.top - expanded.top;
        const scale = target.width / Math.max(1,expanded.width);
        imageFlight = animateMotion(originImage,[
          {transform:start === 'none' ? 'translate3d(0,0,0) scale(1)' : start},
          {transform:`translate3d(${dx}px,${dy}px,0) scale(${scale})`}
        ],{duration:320,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});
        imageFlight.finished.then(finishClose,finishClose);
      };
      const openImage = image => {
        if (!dialog.hidden || openingDialog) return;
        if (!image.isConnected || image.closest('[inert]')) return;
        openingDialog = true;
        originImage = image;
        dialogTitle.textContent = image.alt;
        const captions = {'wechat.png':'打开微信，扫码添加好友','qq.png':'打开 QQ，扫码添加好友','alipay.png':'请使用支付宝扫码打赏','wechatpay.png':'请使用微信扫码打赏'};
        dialogCaption.textContent = captions[image.dataset.filename] || '扫描二维码';
        const source = image.getBoundingClientRect();
        const bounds = page.getBoundingClientRect();
        const pageWidth = page.clientWidth;
        const pageHeight = page.offsetHeight;
        previousMinHeight = page.style.minHeight;
        imageSlot = document.createElement('span');
        imageSlot.className = 'yy-qr-slot';
        imageSlot.style.width = source.width + 'px';
        imageSlot.style.height = source.height + 'px';
        image.before(imageSlot);
        image.classList.add('yy-dialog-image');
        stage.append(image);
        dialog.hidden = false;
        dialog.setAttribute('aria-hidden','false');
        const top = Math.max(16,source.top - bounds.top - page.clientTop - 32);
        dialog.style.left = Math.max(16,(pageWidth - Math.min(340,pageWidth - 32)) / 2) + 'px';
        dialog.style.top = top + 'px';
        const expanded = image.getBoundingClientRect();
        const dialogHeight = dialog.getBoundingClientRect().height;
        const dx = source.left - expanded.left;
        const dy = source.top - expanded.top;
        const scale = source.width / Math.max(1,expanded.width);
        page.style.minHeight = Math.max(pageHeight,top + dialogHeight + 24) + 'px';
        shade.hidden = false;
        inertStates = [...page.children].filter(element => element !== dialog && element !== shade).map(element => [element,element.inert]);
        inertStates.forEach(([element]) => { element.inert = true; });
        openingDialog = false;
        root.querySelector('#yy-dialog-close').focus({preventScroll:true});
        if (reduceMotion.matches) { shade.classList.add('is-open');dialog.classList.add('yy-present');return; }
        imageFlight = animateMotion(image,[
          {transform:`translate3d(${dx}px,${dy}px,0) scale(${scale})`},
          {transform:'translate3d(0,0,0) scale(1)'}
        ],{duration:360,easing:'cubic-bezier(.25,.75,.25,1)'});
        requestAnimationFrame(() => { if (!dialog.hidden && !closingDialog) { shade.classList.add('is-open');dialog.classList.add('yy-present'); } });
      };
      root.querySelector('#yy-dialog-close').addEventListener('click',closeImage);
      shade.addEventListener('click',() => { tapHaptic();closeImage(); });
      dialog.addEventListener('keydown',event => {
        if (event.key === 'Escape') { event.preventDefault();tapHaptic();closeImage(); }
        if (event.key === 'Tab') { event.preventDefault();root.querySelector('#yy-dialog-close').focus({preventScroll:true}); }
      });
      root.addEventListener('click',event => {
        const qrButton = event.target.closest('.yy-qr-trigger');
        if (qrButton) {
          const image = qrButton.querySelector('img.yy-qr');
          openImage(image);
        }
        const control = event.target.closest('button,a');
        if (!control || !root.contains(control)) return;
        tapHaptic();
        if (qrButton || control.closest('.yy-qr-dialog')) return;
        if (!reduceMotion.matches) {
          if (canAnimate) control.getAnimations().forEach(animation => animation.cancel());
          animateMotion(control,[{transform:'scale(.993)'},{transform:'scale(1)'}],{duration:170,easing:'ease-out'});
        }
        control.classList.add('yy-feedback-host','yy-touched');
        clearTimeout(feedbackTimers.get(control));
        feedbackTimers.set(control,setTimeout(() => control.classList.remove('yy-touched'),200));
        if (!control.matches('.yy-tag,.yy-mini')) return;
        const emoji = control.querySelector('.yy-emoji') || sparkle;
        const sticker = emoji.cloneNode(true);
        sticker.className = 'yy-click-spark';
        sticker.alt = '';
        sticker.removeAttribute('id');
        sticker.setAttribute('aria-hidden','true');
        const bounds = control.getBoundingClientRect();
        const x = event.detail ? event.clientX : bounds.left + bounds.width / 2;
        const y = event.detail ? event.clientY : bounds.top + bounds.height / 2;
        sticker.style.left = Math.max(10,Math.min(window.innerWidth - 36,x + 6)) + 'px';
        sticker.style.top = Math.max(10,Math.min(window.innerHeight - 36,y - 29)) + 'px';
        document.body.append(sticker);
        const stickers = document.querySelectorAll('body>.yy-click-spark');
        if (stickers.length > 8) stickers[0].remove();
        if (!reduceMotion.matches) animateMotion(sticker,[
          {opacity:0,transform:'translate3d(0,5px,0)',offset:0},
          {opacity:1,transform:'translate3d(0,0,0)',offset:.18},
          {opacity:1,transform:'translate3d(0,-3px,0)',offset:.7},
          {opacity:0,transform:'translate3d(0,-15px,0)',offset:1}
        ],{duration:900,easing:'ease-out',fill:'forwards'});
        setTimeout(() => sticker.remove(),reduceMotion.matches ? 800 : 950);
      });
      const reveal = (element, open) => {
        const currentHeight = element.getBoundingClientRect().height;
        element.style.height = currentHeight + 'px';
        void element.offsetHeight;
        element.classList.toggle('is-open', open);
        element.setAttribute('aria-hidden', String(!open));
        element.inert = !open;
        element.style.height = open ? element.querySelector('.yy-reveal-inner').scrollHeight + 'px' : '0px';
        if (open && reduceMotion.matches) element.style.height = 'auto';
      };
      const collapseContact = async generation => {
        const height = panel.getBoundingClientRect().height;
        if (contactCollapseAnimation) {
          contactCollapseAnimation.cancel();
          contactCollapseAnimation = null;
        }
        panel.style.transition = 'none';
        panel.classList.remove('is-open');
        panel.setAttribute('aria-hidden','true');
        panel.inert = true;
        panel.style.height = '0px';
        if (height > .5 && !reduceMotion.matches && canAnimate) {
          const animation = panel.animate([{height:height + 'px'},{height:'0px'}],{duration:360,easing:'cubic-bezier(.4,0,.2,1)',fill:'forwards'});
          contactCollapseAnimation = animation;
          await animation.finished.catch(() => {});
          if (generation !== contactGeneration) return false;
          animation.cancel();
          if (contactCollapseAnimation === animation) contactCollapseAnimation = null;
        }
        if (generation !== contactGeneration) return false;
        panel.style.height = '0px';
        panel.style.transition = '';
        return true;
      };
      root.querySelectorAll('.yy-reveal').forEach(element => {
        element.addEventListener('transitionend',event => {
          if (event.target === element && event.propertyName === 'height' && element.classList.contains('is-open') && !(element === panel && contactSwitching)) element.style.height = 'auto';
        });
      });
      root.querySelector('#yy-reward-detail .yy-detail').replaceChildren(root.querySelector('#yy-payments-template').content.cloneNode(true));
      const surprise = document.createElement('p');
      surprise.className = 'yy-surprise';
      surprise.textContent = '谢谢你请我喝奶茶';
      surprise.prepend(rewardEmoji.cloneNode(true),' ');
      root.querySelector('#yy-reward-detail .yy-detail').prepend(surprise);
      buttons.forEach(button => button.addEventListener('click', async () => {
        const generation = ++contactGeneration;
        const type = button.dataset.contact;
        const close = selected === type;
        if (canAnimate) detail.getAnimations().forEach(animation => animation.cancel());
        contactSwitching = true;
        selected = close ? null : type;
        buttons.forEach(b => {
          const active = !close && b === button;
          b.setAttribute('aria-pressed', String(active));
          b.setAttribute('aria-expanded', String(active));
        });
        const collapsed = await collapseContact(generation);
        if (!collapsed || generation !== contactGeneration) return;
        contactSwitching = false;
        if (close) return;
        detail.replaceChildren(root.querySelector(templates[type]).content.cloneNode(true));
        reveal(panel, true);
      }));
      [['#yy-reward','#yy-reward-detail']].forEach(([buttonId,panelId]) => {
        const button = root.querySelector(buttonId);
        const element = root.querySelector(panelId);
        button.addEventListener('click', () => {
          const open = !element.classList.contains('is-open');
          button.setAttribute('aria-expanded', String(open));
          reveal(element, open);
        });
      });
      const resizeOpenPanels = () => {
        if (!dialog.hidden) {
          page.style.minHeight = previousMinHeight;
          const bounds = page.getBoundingClientRect();
          const source = imageSlot && imageSlot.isConnected ? imageSlot.getBoundingClientRect() : null;
          const naturalPageHeight = page.offsetHeight;
          if (source) dialog.style.top = Math.max(16,source.top - bounds.top - page.clientTop - 32) + 'px';
          dialog.style.left = Math.max(16,(page.clientWidth - dialog.offsetWidth) / 2) + 'px';
          const dialogTop = Number.parseFloat(dialog.style.top) || 16;
          page.style.minHeight = Math.max(naturalPageHeight,dialogTop + dialog.offsetHeight + 24) + 'px';
        }
        root.querySelectorAll('.yy-reveal.is-open').forEach(element => {
          if (element === panel && contactSwitching) return;
          if (element.style.height !== 'auto') element.style.height = element.querySelector('.yy-reveal-inner').scrollHeight + 'px';
        });
      };
      let resizeFrame = 0;
      window.addEventListener('resize', () => {
        cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(resizeOpenPanels);
      });
      root.addEventListener('load', event => { if (event.target.matches('img.yy-qr')) resizeOpenPanels(); },true);
      root.querySelector('.yy-avatar').addEventListener('contextmenu',event => event.preventDefault());
      if (!reduceMotion.matches) {
        const entryGroups = [...root.querySelectorAll('.yy-top,.yy-hero,.yy-intro,.yy-tags,.yy-section,.yy-footer')];
        entryGroups.forEach((element,index) => {
          animateMotion(element,[{opacity:0,transform:'translate3d(0,18px,0)'},{opacity:1,transform:'translate3d(0,0,0)'}],{
            duration:index < 2 ? 1150 : 1050,
            delay:Math.min(index * 65,455),
            easing:'cubic-bezier(.16,1,.3,1)',
            fill:'backwards'
          });
        });
      }
    })();
  </script>
</div>
