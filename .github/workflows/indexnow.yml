name: Notify IndexNow

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify participating search engines
        run: |
          curl --fail-with-body --silent --show-error \
            -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            --data '{"host":"furryhk.cn","key":"7b6f38c1d2a94e7fa5c84319b06e2d71","keyLocation":"https://furryhk.cn/7b6f38c1d2a94e7fa5c84319b06e2d71.txt","urlList":["https://furryhk.cn/"]}'
