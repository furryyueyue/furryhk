name: sync-from-live
on:
  push:
    paths:
      - '.sync3/**'
      - '.github/workflows/sync-from-live.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull final index.html from live origin
        run: python3 .sync3/sync3.py
