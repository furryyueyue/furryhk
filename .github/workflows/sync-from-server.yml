name: Sync site files from server snapshot
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/sync-from-server.yml'
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download snapshot files
        run: |
          set -e
          curl -fsSL "https://aka.doubaocdn.com/s/cUjW5nsXeb" -o index.html
          mkdir -p games/text-dandelion
          curl -fsSL "https://aka.doubaocdn.com/s/fQftkhVVxm" -o games/text-dandelion/index.html
          ls -l index.html games/text-dandelion/index.html
          grep -o '你可以叫我 <span>[^<]*</span>' index.html
          tail -c 40 index.html | od -c | tail -2
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html games/text-dandelion/index.html
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: sync index.html & games with server [skip ci]"
            git push origin HEAD:main
          fi
