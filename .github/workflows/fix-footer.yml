name: fix-footer
on:
  push:
    paths:
      - '.rebuild/**'
      - '.github/workflows/fix-footer.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore full index.html and apply footer fix
        run: python3 .rebuild/fix.py
